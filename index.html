<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1a1d1b">
    <title>ROLLING MILE Berlin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main id="handheld">
        <section id="bezel">
            <div id="bezel-label"><span class="led" aria-hidden="true"></span>RUN CLUB · BERLIN</div>
            <canvas id="game-canvas" width="160" height="144" aria-label="ROLLING MILE Berlin game screen"></canvas>
        </section>

        <div id="logo">ROLLING MILE</div>

        <div id="controls">
            <div id="dpad" aria-label="Direction pad">
                <button type="button" class="dp up" data-key="ArrowUp" aria-label="Up"></button>
                <button type="button" class="dp left" data-key="ArrowLeft" aria-label="Left"></button>
                <span class="dp mid" aria-hidden="true"></span>
                <button type="button" class="dp right" data-key="ArrowRight" aria-label="Right"></button>
                <button type="button" class="dp down" data-key="ArrowDown" aria-label="Down"></button>
            </div>
            <div id="ab">
                <div class="ab-btn"><button type="button" data-key="x" aria-label="B: hold to run"></button><span>B</span></div>
                <div class="ab-btn a"><button type="button" data-key=" " aria-label="A: talk or read"></button><span>A</span></div>
            </div>
            <div id="startsel">
                <div class="pill"><button type="button" data-key="p" aria-label="Start: pause and map"></button><span>START</span></div>
            </div>
        </div>

        <p id="hint">Arrows/WASD move · Z/Space A · hold X/Shift run · P start</p>
    </main>
    <script src="game.js"></script>
</body>

</html>
